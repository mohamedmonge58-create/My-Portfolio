<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- خلفية سوداء عميقة فخمة -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- تدرج احترافي للحروف (أبيض ناصع إلى فضي متألق) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- تدرج لون مميز للحرف الثاني لإعطاء تباين عصري (اختياري، لون أزرق نيون هادئ) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- الخلفية المربعة ذات الزوايا المنحنية المتوافقة مع الأيقونات الحديثة -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#bgGrad)" />

  <!-- إطار خارجي رفيع وراقي جداً يحيط بالأيقونة -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

  <!-- رسم حرفي MM بتصميم هندسي متناسق وقوي -->
  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- الحرف الأول M -->
    <path d="
      M 105 360
      V 152
      H 138
      L 182 250
      L 226 152
      H 259
      V 360
      H 228
      V 212
      L 192 295
      H 172
      L 136 212
      V 360
      Z" fill="url(#textGrad)" />

    <!-- الحرف الثاني M (متداخل ومصمم بعناية) -->
    <path d="
      M 253 360
      V 152
      H 286
      L 330 250
      L 374 152
      H 407
      V 360
      H 376
      V 212
      L 340 295
      H 320
      L 284 212
      V 360
      Z" fill="url(#accentGrad)" />
  </g>
</svg>